name: Android readiness (unsigned)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-readiness.yml'
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'supabase/functions/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - 'postcss.config.*'
      - 'tailwind.config.*'
      - 'index.html'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner Android prerequisites
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}" || { echo 'Android SDK is required'; exit 1; }
          test -d "$ANDROID_HOME/platforms/android-36" || { echo 'Install approved Android SDK 36 on this runner'; exit 1; }
      - run: npm ci
      - run: npm run validate
      - name: Compile debug APK and unsigned release bundle
        run: npm run android:build
      - name: Preserve unsigned build and reports
        uses: actions/upload-artifact@v4
        with:
          name: wakestate-unsigned-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/

  emulator-capture:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wakestate-unsigned-${{ github.sha }}
          path: artifacts/build
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture fresh Android launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/store/emulator-capture.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wakestate-android-capture-${{ github.sha }}
          path: artifacts/store/android/
          retention-days: 14
          if-no-files-found: error
